<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .box { fill:#F5F7FB; stroke:#2B4A6F; stroke-width:2; rx:8; }
    .component { font: bold 14px/1.2 "Segoe UI", Arial, sans-serif; fill:#10223A; }
    .annotation { font: 12px/1.2 "Segoe UI", Arial, sans-serif; fill:#10223A; }
    .small { font: 11px "Segoe UI", Arial, sans-serif; fill:#10223A; }
    .arrow { stroke:#2B4A6F; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
    .dashed { stroke-dasharray:6 6; }
    .container { fill:none; stroke:#A0AEC0; stroke-width:2; rx:12; }
    .label-bg { fill:#2B4A6F; opacity:0.08; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2B4A6F"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="24" y="30" class="component">Figure 1 — Architecture: Decoupled Mini‑Splunk Log Analytics Ecosystem</text>

  <!-- Docker Compose container -->
  <rect x="12" y="48" width="1176" height="700" class="container" />
  <text x="26" y="68" class="small">Orchestration: docker-compose.yml (services, networks, volumes, restart & healthchecks)</text>

  <!-- Left: Forwarder -->
  <g transform="translate(40,110)">
    <rect class="box" x="0" y="0" width="170" height="80" />
    <text x="12" y="28" class="component">Forwarder (CLI)</text>
    <text x="12" y="48" class="annotation">Reads local syslog (RFC5424)</text>
    <text x="12" y="64" class="annotation">INGEST &lt;file&gt; → Gateway</text>
  </g>

  <!-- Gateway -->
  <g transform="translate(240,80)">
    <rect class="box" x="0" y="0" width="220" height="120" />
    <text x="12" y="28" class="component">API Gateway / Search Head</text>
    <text x="12" y="48" class="annotation">Accepts CLI commands (INGEST, QUERY, PURGE)</text>
    <text x="12" y="66" class="annotation">Orchestrates scatter‑gather queries and publishes to broker</text>
    <text x="12" y="86" class="annotation">Parallel shard queries; aggregates results</text>
  </g>

  <!-- Arrow Forwarder -> Gateway -->
  <path d="M210 150 L240 140" class="arrow"/>

  <!-- Message Broker -->
  <g transform="translate(520,60)">
    <rect class="box" x="0" y="0" width="240" height="140" />
    <text x="12" y="28" class="component">Message Broker (durable topic)</text>
    <text x="12" y="48" class="annotation">Partitioned log (e.g., Kafka) or AMQP broker</text>
    <text x="12" y="66" class="annotation">Partitions → parallelism, replication (acks=all)</text>
    <text x="12" y="84" class="annotation">Consumer groups for load balancing</text>
  </g>

  <!-- Arrow Gateway -> Broker -->
  <path d="M460 130 L520 130" class="arrow"/>

  <!-- Worker nodes (consumer group) -->
  <g transform="translate(520,230)">
    <text x="0" y="0" class="component">Distributed Worker Nodes (scaleable)</text>
    <g transform="translate(0,8)">
      <rect class="box" x="0" y="18" width="220" height="60" />
      <text x="10" y="42" class="annotation">Worker 1: parses syslog → canonical fields</text>
      <text x="10" y="58" class="annotation small">Idempotent IDs (SHA-256 over timestamp+host+process+msg)</text>
    </g>
    <g transform="translate(240,8)">
      <rect class="box" x="0" y="18" width="220" height="60" />
      <text x="10" y="42" class="annotation">Worker 2: parses & indexes</text>
      <text x="10" y="58" class="annotation small">Acknowledges after successful index</text>
    </g>
    <g transform="translate(480,8)">
      <rect class="box" x="0" y="18" width="220" height="60" />
      <text x="10" y="42" class="annotation">Worker N: scaled replicas</text>
      <text x="10" y="58" class="annotation small">Restart policy, healthchecks</text>
    </g>
  </g>

  <!-- Arrows Broker -> Workers -->
  <path d="M640 200 L640 230" class="arrow"/>
  <path d="M880 200 L880 230" class="arrow"/>
  <path d="M1120 200 L1120 230" class="arrow"/>

  <!-- Search Cluster -->
  <g transform="translate(120,350)">
    <rect class="box" x="0" y="0" width="920" height="220" />
    <text x="12" y="26" class="component">Partitioned Search Cluster (Index / Shards)</text>
    <text x="12" y="46" class="annotation">Multi-node, sharded & replicated (e.g., Elasticsearch)</text>

    <!-- Shards -->
    <g transform="translate(28,56)">
      <rect x="0" y="0" width="220" height="100" fill="#FFFFFF" stroke="#2B4A6F" stroke-width="1.5" rx="6"/>
      <text x="14" y="26" class="annotation">Shard A (primary + replicas)</text>
      <text x="14" y="46" class="small">Contains subset of index; inverted index for keywords</text>
    </g>

    <g transform="translate(330,56)">
      <rect x="0" y="0" width="220" height="100" fill="#FFFFFF" stroke="#2B4A6F" stroke-width="1.5" rx="6"/>
      <text x="14" y="26" class="annotation">Shard B (primary + replicas)</text>
      <text x="14" y="46" class="small">Cross-shard scatter‑gather queries</text>
    </g>

    <g transform="translate(632,56)">
      <rect x="0" y="0" width="220" height="100" fill="#FFFFFF" stroke="#2B4A6F" stroke-width="1.5" rx="6"/>
      <text x="14" y="26" class="annotation">Shard C (primary + replicas)</text>
      <text x="14" y="46" class="small">Replicated for HA; rebalancing on node loss</text>
    </g>
  </g>

  <!-- Arrows: Workers -> Search Cluster -->
  <path d="M680 290 L220 360" class="arrow" />
  <path d="M920 290 L520 360" class="arrow" />
  <path d="M1160 290 L840 360" class="arrow" />

  <!-- Scatter-gather: Gateway -> Search Cluster -->
  <path d="M360 170 L360 290 L200 360" class="arrow dashed" />
  <text x="270" y="260" class="small">Scatter‑gather: parallel queries to shards</text>

  <!-- Distributed Lock Service (Redis) -->
  <g transform="translate(980,420)">
    <rect class="box" x="0" y="0" width="170" height="80" />
    <text x="12" y="28" class="component">Distributed Lock</text>
    <text x="12" y="48" class="annotation">Redis + Redlock / cluster coordination</text>
    <text x="12" y="64" class="annotation small">Used for exclusive ops (PURGE), lease timeouts</text>
  </g>

  <!-- Arrows to Lock service -->
  <path d="M640 260 L1060 420" class="arrow" />
  <path d="M420 110 L1060 420" class="arrow" />

  <!-- Legend -->
  <rect x="24" y="540" width="320" height="188" fill="#FFFFFF" stroke="#2B4A6F" stroke-width="1.5" rx="8"/>
  <text x="40" y="566" class="component">Legend & Key Resilience Elements</text>
  <text x="40" y="590" class="small">• Broker: durable partitioned topic (replication, acks)</text>
  <text x="40" y="610" class="small">• Workers: consumer group semantics, ack after index</text>
  <text x="40" y="630" class="small">• Idempotence: deterministic doc IDs → duplicate avoidance</text>
  <text x="40" y="650" class="small">• Search cluster: shards + replicas (scatter‑gather)</text>
  <text x="40" y="670" class="small">• Locking: Redis/Redlock for exclusive operations (PURGE)</text>
  <text x="40" y="690" class="small">• Orchestration: docker-compose → single manifest for 1‑click deploy</text>

  <!-- Footer -->
  <text x="24" y="740" class="small">Notes: This diagram shows data flow during INGEST and QUERY. For chaos testing annotate: killed worker → consumer rebalance → no acknowledged data loss (durable broker + replicas).</text>

</svg>
